name: NestJS CI Pipeline
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nestjs-ci-${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: Build, Test, Quality and Security
    runs-on: ubuntu-latest

    steps:
      # 1. SOURCE CODE CHECKOUT
      - name: Checkout source code
        uses: actions/checkout@v6

      # 2. NODE ENVIRONMENT
      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      
      # 3. DEPENDENCIES
      - name: install dependencies
        run: npm ci

      # 4. BUILD
      - name: Build application
        run: npm run build 
      
      # 5. UNIT TESTS
      - name: Run units tests
        run: npm test 

      # 6. INTEGRATION TESTS
      - name: Run E2E tests
        run: npm run test:e2e

      # 7. CODE QUALITY
      - name: Run lint
        run: npm run lint

      # 8. SECURITY
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      
      # 9. Docker BUILDX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 10. Docker IMAGE BUILD
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nestjs-ci-cd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max