
name: NestJS CI Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestjs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # JOB 1: APPLICATION VALIDATION
  ci:
    name: Build, Test and Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run lint
        run: npm run lint

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high


  # JOB 2: DOCKER BUILD, SCAN AND PUBLISH
  publish:
    name: Build, Scan and Publish Docker Image
    needs: ci
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: nestjs-ci-cd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nestjs-ci-cd:${{ github.sha }}
          scan-type: image
          format: table
          output: trivy-scan-report.txt
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-scan-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker tag nestjs-ci-cd:${{ github.sha }} \
            $DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG

          docker tag nestjs-ci-cd:${{ github.sha }} \
            $DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker push $DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG

          if [ "$IMAGE_TAG" != "${{ github.sha }}" ]; then
            docker push $DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}
          fi
