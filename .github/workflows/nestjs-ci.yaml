
name: NestJS CI Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestjs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # JOB 1: APPLICATION VALIDATION
  ci:
    name: Build, Test and Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload NestJS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run lint
        run: npm run lint

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high


  # JOB 2: DOCKER BUILD, SCAN AND PUBLISH
  publish:
    name: Build, Scan and Publish Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    outputs:
      image_digest: ${{ steps.push-image.outputs.image_digest }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: nestjs-ci-cd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nestjs-ci-cd:${{ github.sha }}
          scan-type: image
          format: table
          output: trivy-scan-report.txt
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-scan-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker tag nestjs-ci-cd:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG"

          docker tag nestjs-ci-cd:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}"

      - name: Push Docker image
        id: push-image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG"

          PUSH_OUTPUT=$(docker push "$IMAGE" 2>&1)
          echo "$PUSH_OUTPUT"

          IMAGE_DIGEST=$(echo "$PUSH_OUTPUT" | grep -oE 'digest: sha256:[a-f0-9]+' | tail -n 1 | awk '{print $2}')

          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Failed to capture Docker image digest"
            exit 1
          fi

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published image digest: $IMAGE_DIGEST"

          if [ "$IMAGE_TAG" != "${{ github.sha }}" ]; then
            docker push "$DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}"
          fi


  # JOB 3: PROMOTE DOCKER IMAGE
  promote:
    name: Promote Docker Image
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Show published image digest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          echo "Image digest: $IMAGE_DIGEST"


  # JOB 4: DOWNLOAD AND VERIFY BUILD ARTIFACTS
  consume-artifacts:
    name: Download and Verify Build Artifacts
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download NestJS build artifact
        uses: actions/download-artifact@v4
        with:
          name: nestjs-build
          path: ./download-build

      - name: Verify downloaded artifact
        run: |
          echo "Downloaded NestJS build artifact:"
          ls -lah ./download-build


  # JOB 5: STATIC MATRIX COMPATIBILITY
  matrix-compatibility:
    name: Static Compatibility - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version: [20, 24]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  # JOB 6: GENERATE DYNAMIC MATRIX
  generate-dynamic-matrix:
    name: Generate Dynamic Matrix
    runs-on: ubuntu-latest

    outputs:
      node_versions: ${{ steps.set-matrix.outputs.node_versions }}

    steps:
      - name: Generate Node.js versions
        id: set-matrix
        run: |
          echo 'node_versions=["20","22","24"]' >> "$GITHUB_OUTPUT"

      - name: Display generated matrix
        run: |
          echo "Generated versions:"
          echo '${{ steps.set-matrix.outputs.node_versions }}'


  # JOB 7: DYNAMIC MATRIX COMPATIBILITY
  dynamic-matrix-compatibility:
    name: Dynamic Compatibility - Node ${{ matrix.node-version }}
    needs: generate-dynamic-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version: ${{ fromJSON(needs.generate-dynamic-matrix.outputs.node_versions) }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
