name: NestJS CI Pipeline
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nestjs-ci-${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: Build, Test, Quality and Security
    runs-on: ubuntu-latest

    steps:
      # 1. SOURCE CODE CHECKOUT
      - name: Checkout source code
        uses: actions/checkout@v6

      # 2. NODE ENVIRONMENT
      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      
      # 3. DEPENDENCIES
      - name: install dependencies
        run: npm ci

      # 4. BUILD
      - name: Build application
        run: npm run build 
      
      # 5. UNIT TESTS
      - name: Run units tests
        run: npm test 

      # 6. INTEGRATION TESTS
      - name: Run E2E tests
        run: npm run test:e2e

      # 7. CODE QUALITY
      - name: Run lint
        run: npm run lint

      # 8. SECURITY
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      
      # 9. Docker BUILDX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 10. Docker IMAGE BUILD
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: nestjs-ci-cd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 11. Trivy vulnerability scan
      - name: Scan Docker image for vulnerabilities
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nestjs-ci-cd:${{ github.sha}}
          scan-type: 'image'
          format: 'table'
          output: 'trivy-scan-report.txt'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # 12. Upload Trivy scan report
      - name: Upload trivy scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-scan-report.txt

     # 13. Login into DockerHub
      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 14. Tag Docker image
      - name: Tag Docker image
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker tag nestjs-ci-cd:${{ github.sha }} \
            $DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG

          docker tag nestjs-ci-cd:${{ github.sha }} \
            $DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}

      # 15. Push Docker image
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker push $DOCKERHUB_USERNAME/nestjs-ci-cd:$IMAGE_TAG

          if [ "$IMAGE_TAG" != "${{ github.sha }}" ]; then
            docker push $DOCKERHUB_USERNAME/nestjs-ci-cd:${{ github.sha }}
          fi